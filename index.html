<!doctype html>
<html lang="de">
    <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Seite</title>
  <link rel="stylesheet" href="style.css">
    </head>
    <body>
  <div id="grid">
    <div class="tile" id="tile-1">Feld 1</div>
    <div class="tile">Feld 2</div>
    <div class="tile">Feld 3</div>
    <div class="tile">Feld 4</div>
    <div class="tile">Feld 5</div>
    <div class="tile">Feld 6</div>
    <div class="tile">Feld 7</div>
    <div class="tile" id="tile-8">Feld 8</div>
 </div>
    <div id="overlay" style="
      display:none;
      position: fixed;
      inset: 0;
      background: white;
      padding: 20px;
      z-index: 1000;
    ">
  <h1 id="overlay-title">Trinkspiel</h1>
<p id="overlay-text">Bitte Spieleranzahl eingeben:</p>
<input
  id="player-count"
  type="number"
  min="1"
  max="9"
  placeholder="1–9"
/>
<br><br>
<button id="start-game">Start</button>
<button id="close">Zurück</button>
<p id="game-message"></p>
</div>
   <script src="script.js?v=2"></script>     
</body>

</html>
